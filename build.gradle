// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.7'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'

    }
}

def calamusFirebaseFile = file('TMessagesProj_App/google-services.json')
ext.calamusFirebaseEnabled = false
if (calamusFirebaseFile.exists()) {
    def firebase = new groovy.json.JsonSlurper().parse(calamusFirebaseFile)
    ext.calamusFirebaseEnabled = firebase.client?.any {
        it.client_info?.android_client_info?.package_name == APP_PACKAGE
    } ?: false
}

ext.calamusEmulator = findProperty('calamus.emulator') == 'true'
def calamusPrivateProperties = new Properties()
def calamusPrivateFile = file('local.properties')
if (calamusPrivateFile.exists()) calamusPrivateFile.withInputStream { calamusPrivateProperties.load(it) }
ext.calamusMapsApiKey = System.getenv('GOOGLE_MAPS_API_KEY') ?: calamusPrivateProperties.getProperty('GOOGLE_MAPS_API_KEY', '')

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
subprojects {
    plugins.withId('com.android.application') {
        android {
            defaultConfig {
                manifestPlaceholders.CALAMUS_MAPS_API_KEY = rootProject.ext.calamusMapsApiKey
            }
            androidResources {
                noCompress += ['pyc']
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}

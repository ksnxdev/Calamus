import java.nio.file.Files
import java.nio.file.Paths

apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

if (rootProject.ext.calamusFirebaseEnabled) { apply plugin: 'com.google.firebase.crashlytics' }
apply plugin: 'kotlin-android'

def calamusLocalProperties = new Properties()
def calamusLocalFile = rootProject.file('local.properties')
if (calamusLocalFile.exists()) calamusLocalFile.withInputStream { calamusLocalProperties.load(it) }
def calamusSigningProperties = new Properties()
def calamusSigningFile = rootProject.file(System.getenv('CALAMUS_SIGNING_PROPERTIES') ?: calamusLocalProperties.getProperty('CALAMUS_SIGNING_PROPERTIES', '../signing/calamus-signing.properties'))
if (calamusSigningFile.exists()) calamusSigningFile.withInputStream { calamusSigningProperties.load(it) }
def calamusSigningValue = { name -> System.getenv(name) ?: calamusSigningProperties.getProperty(name) }
def calamusSigningReady = ['CALAMUS_KEYSTORE_PATH', 'CALAMUS_KEYSTORE_PASSWORD', 'CALAMUS_KEY_ALIAS', 'CALAMUS_KEY_PASSWORD'].every { calamusSigningValue(it) }

/*repositories {
    mavenCentral()
    google()
}*/

configurations {
    compile.exclude module: 'support-v4'
}

configurations.configureEach {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment-ktx:1.9.0'
    implementation 'androidx.core:core-ktx:1.18.0'

    implementation 'com.google.android.play:app-update:2.1.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    packagingOptions { jniLibs { useLegacyPackaging = true } }
    kotlinOptions {
        jvmTarget = '17'
    }

    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
//        localeFilters += ["zz"]
    }

    signingConfigs {

        release {
            if (calamusSigningReady) {
                storeFile rootProject.file(calamusSigningValue('CALAMUS_KEYSTORE_PATH'))
                storePassword calamusSigningValue('CALAMUS_KEYSTORE_PASSWORD')
                keyAlias calamusSigningValue('CALAMUS_KEY_ALIAS')
                keyPassword calamusSigningValue('CALAMUS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable rootProject.ext.calamusEmulator
            jniDebuggable rootProject.ext.calamusEmulator
            signingConfig signingConfigs.debug
//            applicationIdSuffix ".beta"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
//            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'NONE'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'NONE'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions = ["minApi"]

    productFlavors {
        bundleAfat {
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters.addAll(rootProject.ext.calamusEmulator ? ['x86_64'] : ['armeabi-v7a', 'arm64-v8a'])
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        bundleAfat_SDK23 {
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters.addAll(rootProject.ext.calamusEmulator ? ['x86_64'] : ['armeabi-v7a', 'arm64-v8a'])
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            minSdkVersion 23
            ext {
                abiVersionCode = 2
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters.addAll(rootProject.ext.calamusEmulator ? ['x86_64'] : ['armeabi-v7a', 'arm64-v8a'])
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abi = output.getFilter('ABI')
            if (abi == null) abi = 'universal'
            def calamusApkName = rootProject.ext.calamusEmulator ? "Calamus-Emulator" : "Calamus"
            outputFileName = "${calamusApkName}-${defaultConfig.versionName}-${variant.buildType.name}-${abi}.apk"
            output.versionCodeOverride = defaultConfig.versionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        versionName (project.findProperty('CALAMUS_VERSION_NAME') ?: APP_VERSION_NAME)
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    splits.abi {
        enable false
        reset()
        //noinspection ChromeOsAbiSupport
        include(*(rootProject.ext.calamusEmulator ? ['x86_64'] : ['arm64-v8a', 'armeabi-v7a']))
        universalApk true
    }
}

/** *
 *
 * CI/CD is used for copying APKs to Desktop
 *
 * **/

static def loadEnv(filePath) {
    def env = [:]
    if (!Files.exists(Paths.get(filePath))) return env
    Files.lines(Paths.get(filePath)).each { line ->
        if (line && !line.startsWith("#")) {
            def (key, value) = line.split('=', 2)
            env[key.trim()] = value?.trim()
        }
    }
    return env
}

def env = loadEnv("${project.rootDir}/secrets_for_ci.env")

env.each { key, value ->
    ext."$key" = value
}

static def isWindows() {
    def osName = System.getProperty('os.name').toLowerCase()
    return osName.contains('win')
}

static def isMacOS() {
    def osName = System.getProperty('os.name').toLowerCase()
    return osName.contains('mac')
}

static def isWindowsOrMacOS() {
    def osName = System.getProperty('os.name').toLowerCase()
    return osName.contains('win') || osName.contains('mac')
}

def desktopPath = "${buildDir}/exports"
if (isWindows()) {
    desktopPath = "C:/Users/${SYSTEM_USERNAME}/Desktop/Cherry/Stable"
} else if (isMacOS()) {
    desktopPath = "/Users/${SYSTEM_USERNAME}/Desktop/Cherry/Stable"
}

tasks.register('copyFiles', Copy) {
    from "${projectDir}/afat/release/"
    include '**/*.aab'
    into desktopPath
}

tasks.configureEach { task ->
    if (task.name == 'extractProguardFiles') {
        task.doFirst {
            delete "${projectDir}/afat/release/"
        }
    }

    if (task.name == 'bundleAfatRelease') {
        if (isWindowsOrMacOS()) {
            task.finalizedBy 'copyFiles'
        }
    }
}

if (rootProject.ext.calamusFirebaseEnabled) { apply plugin: 'com.google.gms.google-services' }
